name: rehab_med
description: 康復醫療跨端應用 (RehabMedApp) — 香港市場，供醫生/康復治療師使用的合規輔助工具。
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  crypto: ^3.0.5                   # 低階雜湊（完整性校驗）
  dio: ^5.7.0                      # 網路（含攔截器 / 重試 / 超時 / 證書綁定）
  encrypt: ^5.0.3                  # AES-GCM 靜態加密（at rest）
  ffmpeg_wasm: ^1.0.1              # Web 端影片剪輯引擎（瀏覽器內 ffmpeg.wasm，裁剪+壓縮）
  file_picker: ^10.3.10             # 檔案匯入（選檔）；10.3.3+ compileSdk 跟隨 flutter 默認，10.3.9+ 支援 Gradle 9
  fl_chart: ^0.68.0                # 數據可視化（折線/柱狀）
  flutter:
    sdk: flutter
  flutter_local_notifications: ^17.0.0  # 本機通知（匯入完成等；push 留 phase 2）
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^2.5.1         # 狀態管理 + 依賴注入（provider 即 DI）
  flutter_screenutil: ^5.9.3       # 響應式尺寸（mobile-first）
  flutter_secure_storage: ^9.2.2   # 加密 KV（Keychain/Keystore）：token、加解密金鑰
  flutter_svg: ^2.0.10             # 圖示 / 插畫（附文字替代）
  freezed_annotation: ^2.4.1       # 序列化（型別安全模型，減少運行期錯誤）
  go_router: ^14.2.7               # 路由（含 auth / 角色守衛）
  hive: ^2.2.3                     # 本地 NoSQL 快取（脫敏後資料）
  hive_flutter: ^1.1.0
  intl: ^0.20.0                    # 國際化（繁體中文為主 / 英文為輔）
  json_annotation: ^4.9.0
  local_auth: ^2.3.0               # 生物辨識閘門
  logger: ^2.4.0                   # 結構化日誌（prod 禁用 print）
  path_provider: ^2.1.4            # 檔案系統目錄（影片/媒體落盤，P3）
  sentry_flutter: ^9.0.0           # 崩潰 / 錯誤上報（事故通報）；9.x 修復 Kotlin 2.3 構建相容
  shared_preferences: ^2.3.2       # 非敏感設定：語言、字體大小、主題
  video_player: ^2.9.2             # 影片播放（剪輯預覽 / 專家端查看，P3）
  video_trimmer: ^5.0.0            # 移動端影片剪輯（Android=MP4Composer / iOS=AVFoundation）

dev_dependencies:
  build_runner: ^2.4.11            # 代碼生成
  custom_lint: ^0.6.0
  flutter_test:
    sdk: flutter
  freezed: ^2.5.2
  integration_test:
    sdk: flutter
  json_serializable: ^6.8.0
  mocktail: ^1.0.3                 # 測試
  riverpod_lint: ^2.3.0           # Riverpod 專屬 lint
  very_good_analysis: ^5.1.0       # 代碼品質 / Lint

flutter:
  uses-material-design: true
  generate: true   # 啟用 l10n，讀取 lib/l10n/*.arb
  assets:
    - assets/
